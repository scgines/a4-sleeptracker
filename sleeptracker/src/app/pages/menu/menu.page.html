<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Sleep Tracker v.0.0</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <div id="timeDisplay">
    <ion-label>{{today}}</ion-label>
  </div>
  <ion-note>To start logging your sleep behavior, navigate to the "View Log" screen.</ion-note>

</ion-content>

<ion-toolbar>
  <ion-tabs>
      <ion-tab-bar>
          <ion-tab-button routerLink="menu" href="/menu">
            <ion-icon name="home-outline"></ion-icon>
            <ion-label>Home</ion-label>
          </ion-tab-button>
          <ion-tab-button routerLink="home" href="/home">
            <ion-icon name="eye-outline"></ion-icon>
            <ion-label>View Log</ion-label>
          </ion-tab-button>
      </ion-tab-bar>
  </ion-tabs>
</ion-toolbar>
