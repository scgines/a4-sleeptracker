<div>
  <ion-modal [isOpen]=openModal (willDismiss)="closeBox()">
    <ng-template>
      <ion-content class="ion-padding">
        <h2>Create New Sleep Log</h2>
        
        <ion-select label="Log Type" placeholder="Choose" [(ngModel)]="logtype" interface="popover">
          <ion-select-option value="Sleepiness">Daytime Sleepiness Log</ion-select-option>
          <ion-select-option value="Overnight">Overnight Log</ion-select-option>
        </ion-select>

        @if(logtype=="Sleepiness")
        {
          <h4>Log Information</h4>
          <ion-list>
            <ion-item>
              <ion-input type="date" [(ngModel)]="date_string" label="Date:"></ion-input>
            </ion-item>  
            <ion-item>
              <ion-input type="time" [(ngModel)]="time_string" name="time_f"></ion-input>
            </ion-item>

          </ion-list>



          <!-- <ion-datetime [(ngModel)]="date"></ion-datetime> -->

          <span id="fatigue-scale">
            <ion-range 
              min="1" 
              max="7" 
              ticks="true" 
              snaps="true" 
              label="Fatigue" 
              pin="true"
              [(ngModel)]="rating"
            ></ion-range>
            <p style="text-align: center;">{{showDescription(rating)}}</p>
          </span>

          <br>
          <ion-list>
            <ion-item>
              <ion-input [(ngModel)]="message" placeholder="Type Message Here...">Additional Notes:</ion-input>
            </ion-item>
          </ion-list>
          
          <div class="modal_ops">
            <ion-button (click)="updateLog()">SEND</ion-button>
            <ion-button (click)="closeBox()">CLOSE</ion-button>
          </div>
        }
        @else if(logtype=="Overnight")
        { 
          <h4>Log Information</h4>
          <ion-list>
            <!-- <ion-item>
              <ion-input label="Date:" type="date" [(ngModel)]="date_string" name="date_f" ></ion-input>
            </ion-item> -->

            <!-- <ion-item>
              <ion-datetime multiple="true" presentation="date" preferWheel="false"></ion-datetime>
            </ion-item> -->

            <ion-item>
              <ion-input label="Start Time:" type="datetime-local" [(ngModel)]="sleepStart" name="date_t"></ion-input>
              <!-- <ion-input label="" type="datetime-local" [(ngModel)]="date_string" name="date_t"></ion-input> -->
            </ion-item>
            
            <ion-item>
              <ion-input label="End Time:" type="datetime-local" [(ngModel)]="sleepEnd" name="date_t"></ion-input>
            </ion-item>

          </ion-list>
          <br>
          <ion-list>
            <ion-item>
              <ion-input [(ngModel)]="message" placeholder="Type Message Here...">Additional Notes:</ion-input>
            </ion-item>
          </ion-list>

          

          <div class="modal_ops">
            <ion-button (click)="updateLog()">SEND</ion-button>
            <ion-button (click)="closeBox()">CLOSE</ion-button>
          </div>
        }
        @else
        {
          <div class="modal_ops">
            <ion-button (click)="closeBox()">CLOSE</ion-button>
          </div>
        }
      </ion-content>
    </ng-template>
  </ion-modal>
</div>
