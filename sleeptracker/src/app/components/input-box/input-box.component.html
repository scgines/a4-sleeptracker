<div>
  <ion-modal [isOpen]=openModal (willDismiss)="closeBox()">
    <ng-template>
      
      <ion-header>
        <ion-toolbar>
          <ion-title>Create New Sleep Log</ion-title>
          <ion-buttons slot="end">
              <ion-button (click)="closeBox()" fill="outline" color="primary">CLOSE</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      
      <ion-content class="ion-padding">
        
        <ion-list inset="true">
          <ion-item>
            <ion-select label="Log Type" placeholder="Choose" [(ngModel)]="logtype" interface="popover">
              <ion-select-option value="Sleepiness">Daytime Sleepiness Log</ion-select-option>
              <ion-select-option value="Overnight">Overnight Log</ion-select-option>
            </ion-select>
          </ion-item>
        </ion-list>

        @if(logtype=="Sleepiness")
        {
          <ion-list inset="true">
            <ion-item lines="none">
              <ion-label>Log Date</ion-label>
            </ion-item >
            
            <ion-item class="dateWheel">
              <ion-datetime presentation="time-date" preferWheel="true" size="cover" [(ngModel)]="logdate"></ion-datetime>
            </ion-item>
          </ion-list>

          <ion-list inset="true">
            <ion-item-group>
              <ion-item lines="none">
                  <ion-range 
                    min="1" 
                    max="7" 
                    ticks="true" 
                    snaps="true" 
                    label="Fatigue:" 
                    pin="true"
                    [(ngModel)]="rating"
                  ></ion-range>
                </ion-item>

                <ion-item lines="none">
                  <ion-label>
                    <p style="text-align: center;">{{showDescription(rating)}}</p>
                  </ion-label>
                </ion-item>
            </ion-item-group>
          </ion-list>
          
          <!-- <div class="modal_ops">
            <ion-button (click)="updateLog()">SEND</ion-button>
            <ion-button (click)="closeBox()">CLOSE</ion-button>
          </div> -->
        }
        @else if(logtype=="Overnight")
        { 
          <ion-list inset="true">
            <ion-item-group class="dateWheel">
              <ion-item lines="none">
                <ion-label>Sleep Date</ion-label>
              </ion-item>

              <ion-item lines="none">
                <ion-datetime presentation="time-date" preferWheel="true" size="cover" [(ngModel)]="sleepStart"></ion-datetime>
              </ion-item>

              <ion-item lines="none">
                <ion-label>Wakeup Date</ion-label>
              </ion-item>

              <ion-item lines="none">
                <ion-datetime presentation="time-date" preferWheel="true" size="cover" [(ngModel)]="sleepEnd" [min]="sleepStart"></ion-datetime>
              </ion-item>
            </ion-item-group>
          </ion-list>


              <!-- <ion-input label="" type="datetime-local" [(ngModel)]="date_string" name="date_t"></ion-input> -->
              <!-- <ion-input label="End Time:" type="datetime-local" [(ngModel)]="sleepEnd" name="date_t"></ion-input> -->

          <!-- <div class="modal_ops">
            <ion-button (click)="updateLog()">SEND</ion-button>
            <ion-button (click)="closeBox()">CLOSE</ion-button>
          </div> -->
        }
        @else
        {
          <!-- <div class="modal_ops">
            <ion-button (click)="closeBox()">CLOSE</ion-button>
          </div> -->
        }
      </ion-content>

      <ion-footer>
        <ion-toolbar>
          @if(logtype=="Overnight" || logtype=="Sleepiness")
          {
            <ion-buttons slot="end">
              <ion-button (click)="updateLog()" fill="solid" color="primary">SEND</ion-button>
            </ion-buttons>
          }
        </ion-toolbar>
      </ion-footer>

    </ng-template>
  </ion-modal>
</div>
