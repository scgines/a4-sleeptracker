<div id="{{data.id}}">
@if(type == "Sleepiness")
{
    <ion-item-sliding>
        <ion-item class="sleepyLog" lines="none">
            <ion-label>
                <h3>{{date}}</h3>
                <p>{{summary}}</p>
                </ion-label>
        </ion-item>
        <ion-item-options>
            @if(confirmDelete == false)
            {
                <ion-item-option (click)="changeDeleteButton()" color="danger">Delete</ion-item-option>
            }
            @else
            {
                <ion-item-option (click)="deleteLog()" (mouseout)="revertDeleteButton()" color="warning">Sure?</ion-item-option>
            }
        </ion-item-options>
    </ion-item-sliding>
}
@else
{
    <ion-item-sliding>
        <ion-item class="overnightLog">
            <ion-label>
                <h2>{{date}}</h2>
                <p>{{summary}}</p>
            </ion-label>
        </ion-item>
        <ion-item-options>
            @if(confirmDelete == false)
            {
                <ion-item-option (click)="changeDeleteButton()" color="danger">Delete</ion-item-option>
            }
            @else
            {
                <ion-item-option (click)="deleteLog()" (mouseout)="revertDeleteButton()" color="warning">Sure?</ion-item-option>
            }
        </ion-item-options>
    </ion-item-sliding>
}
</div>
